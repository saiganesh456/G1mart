<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="70%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="880" height="400" rx="32" fill="url(#bgGrad2)"/>
  <circle cx="830" cy="50" r="170" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="680" cy="360" r="140" fill="#000000" opacity="0.1"/>

  <g transform="translate(60, 60)">
    <rect width="130" height="32" rx="16" fill="#FFFFFF" opacity="0.2"/>
    <text x="65" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#BBF7D0" text-anchor="middle" letter-spacing="1.5">FARM FRESH</text>

    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Fresh vegetables</text>
    <text x="0" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#DCFCE7" letter-spacing="-0.5">&amp; seasonal fruits</text>

    <text x="0" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#BBF7D0">Directly sourced daily from local farmers &amp; mandi.</text>
    <text x="0" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#BBF7D0">Crisp onions, red tomatoes, fresh greens &amp; potatoes.</text>

    <g transform="translate(0, 235)">
      <rect width="160" height="46" rx="23" fill="#FFFFFF" filter="url(#shadow2)"/>
      <text x="80" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#14532D" text-anchor="middle">Shop Produce</text>
    </g>
  </g>

  <!-- Right Graphic: Stylized Basket with Produce -->
  <g transform="translate(620, 90)" filter="url(#shadow2)">
    <!-- Produce Basket / Plate -->
    <ellipse cx="110" cy="180" rx="90" ry="35" fill="#14532D" opacity="0.6"/>
    <!-- Tomato -->
    <circle cx="75" cy="120" r="42" fill="#EF4444"/>
    <ellipse cx="65" cy="105" rx="10" ry="5" fill="#F87171" opacity="0.6"/>
    <path d="M75 80c0 8-5 12-5 12s8-4 12-4c0 0-4-5-4-8Z" fill="#166534"/>
    <!-- Fresh Onion -->
    <ellipse cx="140" cy="130" rx="38" ry="44" fill="#A855F7"/>
    <ellipse cx="132" cy="115" rx="8" ry="14" fill="#C084FC" opacity="0.6"/>
    <path d="M140 86v-8" stroke="#15803D" stroke-width="4" stroke-linecap="round"/>
    <!-- Carrot / Lemon accent -->
    <polygon points="120,165 95,85 108,80" fill="#F97316"/>
    <path d="M100 80l-4-8M104 80v-9M107 80l5-8" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
