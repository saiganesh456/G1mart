<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="60%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="880" height="400" rx="32" fill="url(#bgGrad3)"/>
  <circle cx="840" cy="70" r="160" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="700" cy="340" r="150" fill="#000000" opacity="0.1"/>

  <g transform="translate(60, 60)">
    <rect width="140" height="32" rx="16" fill="#FFFFFF" opacity="0.2"/>
    <text x="70" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#99F6E4" text-anchor="middle" letter-spacing="1.5">HOME ESSENTIALS</text>

    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Household &amp;</text>
    <text x="0" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#CCFBF1" letter-spacing="-0.5">cleaning care</text>

    <text x="0" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#99F6E4">Surf Excel, Ariel, Vim, Lizol, Harpic &amp; Exo.</text>
    <text x="0" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#99F6E4">Keep your home sparkling clean with genuine brands.</text>

    <g transform="translate(0, 235)">
      <rect width="170" height="46" rx="23" fill="#FFFFFF" filter="url(#shadow3)"/>
      <text x="85" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#0F766E" text-anchor="middle">Shop Household</text>
    </g>
  </g>

  <!-- Right Graphic: Cleaning bottle, spray, and sparkle bubbles -->
  <g transform="translate(640, 70)" filter="url(#shadow3)">
    <!-- Spray bottle -->
    <rect x="35" y="120" width="60" height="110" rx="16" fill="#FFFFFF" opacity="0.95"/>
    <rect x="53" y="85" width="24" height="35" fill="#FFFFFF"/>
    <!-- Spray trigger nozzle -->
    <path d="M53 85l-20-15h44l16 10v10l-16-5h-24Z" fill="#0D9488"/>
    <!-- Bottle label -->
    <rect x="43" y="145" width="44" height="50" rx="8" fill="#CCFBF1"/>
    <circle cx="65" cy="170" r="12" fill="#0F766E"/>
    <path d="M60 170l3 3 7-7" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Dishwash / Detergent Tub -->
    <rect x="110" y="140" width="80" height="90" rx="14" fill="#38BDF8" opacity="0.9"/>
    <rect x="105" y="130" width="90" height="15" rx="7" fill="#0284C7"/>
    <circle cx="150" cy="180" r="18" fill="#FFFFFF" opacity="0.8"/>

    <!-- Bubbles / Sparkles -->
    <circle cx="25" cy="70" r="12" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="130" cy="80" r="8" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="170" cy="50" r="16" fill="#FFFFFF" opacity="0.7"/>
    <path d="M110 50l4 8 8 4-8 4-4 8-4-8-8-4 8-4Z" fill="#FDE047"/>
  </g>
</svg>
