<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="360" height="360" rx="20" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Clean Minimalist Product Pack Silhouette -->
  <g transform="translate(140, 100)">
    <rect x="0" y="20" width="120" height="150" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" />
    <path d="M 20 20 L 35 0 L 85 0 L 100 20 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2" />
    <!-- Camera / Lens badge -->
    <circle cx="60" cy="85" r="24" fill="#F1F5F9" stroke="#64748B" stroke-width="2" />
    <circle cx="60" cy="85" r="10" fill="#94A3B8" />
    <rect x="40" y="125" width="40" height="6" rx="3" fill="#CBD5E1" />
  </g>

  <!-- G1 Mart Brand Pill -->
  <g transform="translate(130, 275)">
    <rect width="140" height="26" rx="13" fill="url(#brandGrad)" />
    <text x="70" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">G1 MART</text>
  </g>

  <!-- Status Text -->
  <text x="200" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Photo Pending Verification</text>
  <text x="200" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">Official Pack Photography in Progress</text>
</svg>
